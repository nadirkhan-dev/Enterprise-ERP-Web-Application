services:
  connect:
    image: ghcr.io/libertysupply/connect:dev

    restart: unless-stopped
    ports:
      - 5175:3000
    environment:
      - NUXT_DEPLOY_TOKEN=${DEPLOY_TOKEN}
      - NUXT_LOOKER_BASE_URL=${NUXT_LOOKER_BASE_URL}
      - NUXT_LOOKER_CLIENT_ID=${NUXT_LOOKER_CLIENT_ID}
      - NUXT_LOOKER_CLIENT_SECRET=${NUXT_LOOKER_CLIENT_SECRET}
      - NUXT_SAP_SERVICE_LAYER_URL=${NUXT_SAP_SERVICE_LAYER_URL}
      - NUXT_SAP_COMPANY_DB=${NUXT_SAP_COMPANY_DB}
      - NUXT_SAP_USERNAME=${NUXT_SAP_USERNAME}
      - NUXT_SAP_PASSWORD=${NUXT_SAP_PASSWORD}
      - NUXT_SAP_ALLOW_SELF_SIGNED_CERT=${NUXT_SAP_ALLOW_SELF_SIGNED_CERT}
      - DIRECTUS_URL=${DIRECTUS_URL}
      - NUXT_DIRECTUS_TOKEN=${NUXT_DIRECTUS_TOKEN}
      - NUXT_FEDEX_API_KEY=${NUXT_FEDEX_API_KEY}
      - NUXT_FEDEX_SECRET_KEY=${NUXT_FEDEX_SECRET_KEY}
      - NUXT_FEDEX_SHIPPER_ACCOUNT=${NUXT_FEDEX_SHIPPER_ACCOUNT}
      - NUXT_FEDEX_ACCOUNT=${NUXT_FEDEX_ACCOUNT}
      - NUXT_FEDEX_BILL_TO_ACCOUNT=${NUXT_FEDEX_BILL_TO_ACCOUNT}
      - NUXT_FEDEX_ENV=${NUXT_FEDEX_ENV}
      - NUXT_UPS_CLIENT_ID=${NUXT_UPS_CLIENT_ID}
      - NUXT_UPS_CLIENT_SECRET=${NUXT_UPS_CLIENT_SECRET}
      - NUXT_UPS_SHIPPER_NUMBER=${NUXT_UPS_SHIPPER_NUMBER}
      - NUXT_UPS_ENV=${NUXT_UPS_ENV}
      - NUXT_SQUARE_ACCESS_TOKEN=${NUXT_SQUARE_ACCESS_TOKEN}
      - NUXT_PDF_DOWNLOAD_SERVICE_URL=${NUXT_PDF_DOWNLOAD_SERVICE_URL}
      - NUXT_PDF_DOWNLOAD_SERVICE_USER_NAME=${NUXT_PDF_DOWNLOAD_SERVICE_USER_NAME}
      - NUXT_PDF_DOWNLOAD_SERVICE_USER_PASS=${NUXT_PDF_DOWNLOAD_SERVICE_USER_PASS}
      - NUXT_TURNSTILE_SECRET_KEY=${NUXT_TURNSTILE_SECRET_KEY}
      - NUXT_MS_FORM_RESPONSES_URL=${NUXT_MS_FORM_RESPONSES_URL}
      - NUXT_SERVICEMASTER_WS_URL=${NUXT_SERVICEMASTER_WS_URL}
      - NUXT_SERVICEMASTER_API_KEY=${NUXT_SERVICEMASTER_API_KEY}
      - NUXT_CF_ACCESS_CLIENT_ID=${NUXT_CF_ACCESS_CLIENT_ID}
      - NUXT_CF_ACCESS_CLIENT_SECRET=${NUXT_CF_ACCESS_CLIENT_SECRET}
      # Also passed as a build arg (see Dockerfile). Set here too so the URL can be
      # corrected by redeploying rather than rebuilding the image.
      - NUXT_PUBLIC_PASSWORD_RESET_URL=${NUXT_PUBLIC_PASSWORD_RESET_URL}
    networks:
      - proxy

networks:
  proxy:
    external: true