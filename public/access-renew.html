<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reconnecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Opened in a popup by useCloudflareAccess to renew the Cloudflare Access
    session. Loading anything behind this hostname makes Access re-issue the
    CF_Authorization cookie, so the page itself has no work to do — it is small
    on purpose, to avoid booting a second copy of the app just to touch the edge.

    It does NOT close itself: the opener closes it once it has read the new
    cookie, which removes the race between this window disappearing and that
    read landing. If the user's IdP session has lapsed, Cloudflare shows its own
    sign-in here first and this page is what they land on afterwards.

    Standalone document, so it can't use BaseSpinner or the design tokens — the
    markup and values below mirror them (surface-50 #f8fafc, gray-500 #9ca3a7,
    primary #009bd4), exactly as the PDF loading tab in useDocumentDownload does.
    No overflow clipping anywhere: the orbit is a 3D transform that is meant to
    spill outside its box.
  -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      font-family: "TT Norms Pro", system-ui, -apple-system, sans-serif;
      background: #f8fafc;
    }
    .loading-label { font-size: 14px; font-weight: 300; color: #9ca3a7; }
    .base-spinner {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }
    .base-spinner__orbit, .base-spinner__scene {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .base-spinner__orbit { animation: spinner-planetary 3s linear infinite; }
    .base-spinner__dot {
      position: absolute;
      width: 22%;
      height: 22%;
      margin: -11%;
      border-radius: 50%;
      background: #9ca3a7;
      top: 50%;
      left: 50%;
    }
    .base-spinner__dot:nth-child(1) { animation: spinner-chaos-x 1.5s cubic-bezier(0.7, 0, 0.3, 1) infinite; }
    .base-spinner__dot:nth-child(2) { animation: spinner-chaos-y 1.5s cubic-bezier(0.7, 0, 0.3, 1) infinite; }
    .base-spinner__dot:nth-child(3) { animation: spinner-chaos-z 1.5s cubic-bezier(0.7, 0, 0.3, 1) infinite; }
    @keyframes spinner-planetary {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinner-chaos-x {
      0%, 100% { transform: translate3d(-200%, 0, -50px) scale(0.7); }
      50% { transform: translate3d(200%, 0, 50px) scale(1.4); background: #009bd4; }
    }
    @keyframes spinner-chaos-y {
      0%, 100% { transform: translate3d(0, -200%, -50px) scale(0.7); }
      50% { transform: translate3d(0, 200%, 50px) scale(1.4); background: #009bd4; }
    }
    @keyframes spinner-chaos-z {
      0%, 100% { transform: translate3d(150%, 150%, -100px) scale(0.7); }
      50% { transform: translate3d(-150%, -150%, 100px) scale(1.4); background: #009bd4; }
    }
  </style>
</head>
<body>
  <div class="base-spinner">
    <div class="base-spinner__orbit">
      <div class="base-spinner__scene">
        <div class="base-spinner__dot"></div>
        <div class="base-spinner__dot"></div>
        <div class="base-spinner__dot"></div>
      </div>
    </div>
  </div>
  <div class="loading-label">Reconnecting…</div>
</body>
</html>
