name: PR CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          NUXT_PUBLIC_DIRECTUS_WEBSOCKET_URL: ${{ secrets.DIRECTUS_WEBSOCKET_URL }}
          NUXT_PUBLIC_SQUARE_APPLICATION_ID: ${{ secrets.NUXT_PUBLIC_SQUARE_APPLICATION_ID }}
          NUXT_PUBLIC_SQUARE_LOCATION_ID: ${{ secrets.NUXT_PUBLIC_SQUARE_LOCATION_ID }}
        run: npm run build
